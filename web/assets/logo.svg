<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" width="240" height="40" fill="none">
  <!-- CryptoVista X Enterprise Brand Logo - Horizontal -->
  <g id="brand-mark">
    <!-- Geometric Shield / Horizon Hexagon -->
    <rect x="2" y="4" width="32" height="32" rx="4" fill="#00B386" fill-opacity="0.12" stroke="#00B386" stroke-width="1.5"/>
    <!-- Precision Vista Vectors -->
    <path d="M10 24L18 12L26 24" stroke="#00B386" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 24L18 18L22 24" stroke="#171A21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="10" r="1.75" fill="#00B386"/>
  </g>
  <g id="brand-wordmark">
    <!-- Main Product Name -->
    <text x="44" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#171A21" letter-spacing="-0.3">CryptoVista</text>
    <!-- Accent X -->
    <text x="146" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#00B386">X</text>
    <!-- Enterprise Tier Tag -->
    <rect x="166" y="12" width="68" height="16" rx="2" fill="#F7F8FA" stroke="#E6E8EB" stroke-width="1"/>
    <text x="171" y="23.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#6B7280" letter-spacing="1">ENTERPRISE</text>
  </g>
</svg>
